services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ittracker
      POSTGRES_PASSWORD: ittracker
      POSTGRES_DB: ittracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ittracker"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ittracker:ittracker@db:5432/ittracker
      SEED_SAMPLE: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
