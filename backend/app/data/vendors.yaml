resellers:
  - {name: CADSPRO, sells: [solidworks]}
  - {name: BEACON INDIA, sells: [solidworks]}
  - {name: CONCEPTIA, sells: [solidworks]}
  - {name: EGS COMPUTERS, sells: [solidworks, ptc]}
  - {name: CADD CENTRE, sells: [solidworks, autodesk]}
  - {name: CAPRICOT, sells: [autodesk]}
  - {name: ARKANCE, sells: [autodesk]}
  - {name: ADROITEC, sells: [ptc]}
  - {name: NEILSOFT, sells: [ptc, autodesk]}
  - {name: UNEECOPS, sells: [sap_b1]}
  - {name: COGNITIVE, sells: [sap_b1]}
  - {name: REDINGTON, sells: [microsoft365, quickheal, adobe]}
  - {name: INGRAM MICRO, sells: [microsoft365, adobe, autodesk]}
  - {name: SAVEX, sells: [microsoft365, quickheal]}
  - {name: ANTRAWEB, sells: [tally]}
