  - {name: TALLYSTACK, sells: [tally]}

# Amount fingerprints: exact amounts that identify a product (incl. 18% GST where noted). Tolerance ±1%.
fingerprints:
  - {amount: 5310, vendor: tally, product: 'TSS Silver renewal (₹4,500 + GST)', cycle: yearly}
  - {amount: 4500, vendor: tally, product: 'TSS Silver renewal', cycle: yearly}
  - {amount: 15930, vendor: tally, product: 'TSS Gold renewal (₹13,500 + GST)', cycle: yearly}
  - {amount: 13500, vendor: tally, product: 'TSS Gold renewal', cycle: yearly}
  - {amount: 26550, vendor: tally, product: 'TallyPrime Silver licence (₹22,500 + GST)', cycle: one_time}
  - {amount: 22500, vendor: tally, product: 'TallyPrime Silver licence', cycle: one_time}
  - {amount: 79650, vendor: tally, product: 'TallyPrime Gold licence (₹67,500 + GST)', cycle: one_time}
  - {amount: 67500, vendor: tally, product: 'TallyPrime Gold licence', cycle: one_time}

# Product hints from narration / ledger text -> (vendor, product)
narration_hints:
  - {pattern: 'TSS|TALLY SOFTWARE SERV', vendor: tally, product: 'TSS renewal'}
  - {pattern: 'TALLY', vendor: tally}
  - {pattern: 'SOLIDWORKS|SOLID WORKS', vendor: solidworks, product: 'SolidWorks subscription service'}
  - {pattern: 'AUTOCAD|AUTO CAD|FUSION|INVENTOR', vendor: autodesk}
  - {pattern: 'OFFICE 365|O365|M365|MICROSOFT 365|BUSINESS STANDARD|BUSINESS BASIC', vendor: microsoft365}
  - {pattern: 'WORKSPACE|G ?SUITE', vendor: google_workspace}
  - {pattern: 'SEQRITE|QUICK ?HEAL|ENDPOINT SEC|ANTIVIRUS|ANTI VIRUS', vendor: quickheal}
  - {pattern: 'KASPERSKY', vendor: kaspersky}
  - {pattern: 'ADOBE|ACROBAT|PHOTOSHOP|CREATIVE CLOUD', vendor: adobe}
  - {pattern: 'DOMAIN|HOSTING|SSL', vendor: godaddy, product: 'Domain / hosting'}
  - {pattern: 'SAP B1|SAP BUSINESS ONE|SAP AMC', vendor: sap_b1, product: 'SAP B1 maintenance'}
  - {pattern: 'ZOHO', vendor: zoho}
  - {pattern: '\bAWS\b|AMAZON WEB', vendor: aws}
  - {pattern: 'AZURE', vendor: azure}
  - {pattern: 'ZOOM', vendor: zoom}
  - {pattern: 'WEBSITE AMC|WEB AMC|WEBSITE MAINT', vendor: web_amc, product: 'Website AMC'}
  - {pattern: 'IT AMC|COMPUTER AMC|\bAMC\b|ANNUAL MAINT|MAINTENANCE CONTRACT|IT SUPPORT', vendor: it_amc, product: 'IT support AMC'}
  - {pattern: 'LAPTOP|DESKTOP|PRINTER|SERVER HARDWARE|CCTV', vendor: hardware, product: 'Hardware purchase'}
  - {pattern: 'LICEN[CS]E|SUBSCRIPTION|RENEWAL', product: 'Licence / subscription'}

# Words in a reseller line-item that mean hardware (excluded from subscriptions)
hardware_words: [LAPTOP, DESKTOP, PRINTER, TONER, CARTRIDGE, RAM, SSD, HDD, MONITOR, KEYBOARD, MOUSE, CABLE, ROUTER, SWITCH, UPS, BATTERY, CCTV, CAMERA, SERVER HARDWARE, MOTHERBOARD]
