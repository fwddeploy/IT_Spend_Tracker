  - 'AMAZON SELLER'
  - 'AMAZON\.IN'
  - 'CASH WITHDRAWAL'
  - 'ATM WDL'
  - 'ATM-CASH'
  - 'CHEQUE RETURN'
  - 'REVERSAL'

# Forex markup lines that belong to the previous foreign-currency debit.
fee_patterns:
  - 'MARKUP'
  - 'DCC '
  - 'FOREX FEE'
  - 'FX FEE'
  - 'CROSS CURRENCY'

# Payment gateways: strip the prefix, try the remainder; else ask.
gateway_patterns:
  - 'RAZORPAY'
  - 'RAZ\*'
  - 'RZP'
  - 'PAYU'
  - 'CCAVENUE'
  - 'AVENUES INDIA'
  - 'CASHFREE'
  - 'INSTAMOJO'
  - 'PAYTM'
  - 'PHONEPE'
  - 'BILLDESK'
  - 'STRIPE'
  - 'PAYPAL'
  - 'EASEBUZZ'

# Words that suggest a payee is a local IT reseller / dealer / system integrator (product unknown until confirmed).
reseller_hint_words:
  - INFOTECH
  - INFOSYSTEM
  - INFOSYS
  - COMPUTERS
  - COMPUTER
  - TECHNOLOGIES
  - TECHNOLOGY
  - TECHNO
  - SOFTWARES
  - SOFTWARE
  - SYSTEMS
  - SOLUTIONS
  - IT SERVICES
  - IT SOLUTIONS
  - DIGITAL
  - CAD
  - AUTOMATION
  - NETWORKS
  - TECH

